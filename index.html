<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>影视搜索</title>
<style>
  :root {
    --bg: #0f1720;
    --card: #1a2530;
    --border: #2a3a48;
    --text: #e0e8f0;
    --sub: #8a9aac;
    --accent: #3b82f6;
    --accent2: #60a5fa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(135deg, #16212e, #0f1720);
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 18px; font-weight: 700; margin-bottom: 10px;
    background: linear-gradient(90deg, var(--accent2), #7dd3fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .search-box {
    display: flex; gap: 8px;
  }
  .search-box input {
    flex: 1;
    padding: 11px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box button {
    padding: 11px 20px;
    background: var(--accent);
    color: #fff;
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  .search-box button:active { background: #2563eb; }
  .container { padding: 12px 16px; max-width: 760px; margin: 0 auto; }
  .hint {
    text-align: center; color: var(--sub); padding: 60px 20px;
    line-height: 1.8;
  }
  .result-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all .15s;
  }
  .result-item:active { border-color: var(--accent); transform: scale(.99); }
  .result-item .title {
    font-size: 16px; font-weight: 600; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .result-item .meta {
    font-size: 12px; color: var(--sub); margin-top: 4px;
  }
  .result-item .tag {
    font-size: 12px; color: var(--accent2);
    border: 1px solid var(--accent); border-radius: 6px;
    padding: 2px 8px; white-space: nowrap;
  }
  .loading { text-align: center; color: var(--sub); padding: 30px; }
  .count { font-size: 12px; color: var(--sub); margin-bottom: 10px; }
  .error { text-align: center; color: #f87171; padding: 30px; line-height: 1.6; }
  /* 播放器面板 */
  .player-panel {
    position: fixed; inset: 0; z-index: 100;
    background: #000;
    display: flex; flex-direction: column;
  }
  .player-top {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #0a0f16;
    border-bottom: 1px solid #1f2937;
  }
  .player-top .p-title {
    flex: 1; font-size: 15px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .back-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text); padding: 6px 12px; border-radius: 8px;
    cursor: pointer; font-size: 14px;
  }
  .player-body { flex: 1; position: relative; }
  .player-body iframe {
    width: 100%; height: 100%; border: none;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <h1>🎬 影视搜索</h1>
  <div class="search-box">
    <input id="kw" type="text" placeholder="输入片名，如：狂飙 / 流浪地球" enterkeyhint="search">
    <button id="searchBtn">搜索</button>
  </div>
</div>

<div class="container" id="container">
  <div class="hint" id="hint">
    输入片名搜索<br>
    <span style="font-size:13px">聚合多个影视源，搜到即可在线播放</span>
  </div>
</div>

<!-- 播放器面板 -->
<div class="player-panel hidden" id="player">
  <div class="player-top">
    <button class="back-btn" id="backBtn">‹ 返回</button>
    <div class="p-title" id="pTitle"></div>
  </div>
  <div class="player-body">
    <iframe id="playerFrame" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
  </div>
</div>

<script>
const API = 'https://zip0.com/api/videos/search';
let currentResults = [];

const $ = id => document.getElementById(id);

function node(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}

async function search(keyword) {
  const container = $('container');
  container.innerHTML = '<div class="loading">搜索中…</div>';
  try {
    const url = `${API}?query=${encodeURIComponent(keyword)}&limit=30`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (!data.success || !data.data || data.data.length === 0) {
      container.innerHTML = '<div class="error">未找到相关影片，换个关键词试试</div>';
      return;
    }
    currentResults = data.data;
    renderResults(data.data);
  } catch (e) {
    container.innerHTML = '<div class="error">搜索失败：网络异常或源暂时不可用<br>请稍后重试</div>';
  }
}

function renderResults(list) {
  const container = $('container');
  container.innerHTML = '';
  const count = node('div', 'count', `共 ${list.length} 条结果（点击可播放）`);
  container.appendChild(count);
  list.forEach((item, idx) => {
    const el = node('div', 'result-item');
    const left = node('div');
    left.appendChild(node('div', 'title', item.title));
    const meta = node('div', 'meta',
      [item.year, item.category, item.area, item.score && item.score !== '0.0' ? item.score + '分' : '']
        .filter(Boolean).join(' · '));
    left.appendChild(meta);
    el.appendChild(left);
    el.appendChild(node('span', 'tag', item.remarks || '正片'));
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => play(item));
    container.appendChild(el);
  });
}

function play(item) {
  // 用 watch 页的 url，加 embed=1 便于嵌入
  let wurl = item.url;
  if (!wurl.includes('embed=')) {
    wurl += (wurl.includes('?') ? '&' : '?') + 'embed=1';
  }
  $('pTitle').textContent = item.title;
  $('playerFrame').src = wurl;
  $('player').classList.remove('hidden');
  // 尝试自动进入全屏（横屏）
  document.body.style.overflow = 'hidden';
}

function closePlayer() {
  $('player').classList.add('hidden');
  $('playerFrame').src = 'about:blank';
  document.body.style.overflow = '';
}

$('searchBtn').addEventListener('click', () => {
  const kw = $('kw').value.trim();
  if (kw) search(kw);
});
$('kw').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const kw = $('kw').value.trim();
    if (kw) search(kw);
  }
});
$('backBtn').addEventListener('click', closePlayer);

// 初始默认示例搜索（可选，注释掉以保持干净）
// search('狂飙');
</script>
</body>
</html>
